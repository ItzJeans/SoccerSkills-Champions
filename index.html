<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Soccer Skills Champions browser game">
  <title>Soccer Skills Champions</title>
  <link rel="icon" href="favicon.ico">
  <!-- All relative game assets resolve from this GitHub repository through jsDelivr. -->
  <base href="https://cdn.jsdelivr.net/gh/ItzJeans/SoccerSkills-Champions@main/">
  <link rel="stylesheet" href="launcher-ui/snippets/controls.css">
  <style>
    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0;
      overflow: hidden; background: #000;
    }
    body {
      display: grid; place-items: center;
    }
    @font-face {
      font-family: TekoSkills;
      src: url("data/Teko-Medium.ttf") format("truetype");
      font-display: swap;
    }
    * { font-family: TekoSkills, sans-serif; }
    #gamecanvas {
      display: block; margin: 0 auto; padding: 0; background: #000;
      width: min(1280px, 100vw, calc(100vh * 16 / 9));
      height: auto; aspect-ratio: 16 / 9; touch-action: none;
    }
  </style>
  <script>
    // The original source only includes the interface1 art set.
    var isphone = /Android|BlackBerry|iPhone|iPad|iPod|Opera Mini|IEMobile/i.test(navigator.userAgent);
    var isios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    var checkrotate = true;
    var rosize = new Image();
    rosize.src = "data/resize.gif";

    // Local no-ad compatibility shim for the lifecycle calls expected by the game.
    // Gameplay is retained; third-party advertising SDKs are not loaded.
    window.PokiSDK = {
      init: function () { return Promise.resolve(); },
      gameLoadingStart: function () {},
      gameLoadingFinished: function () {},
      gameplayStart: function () {},
      gameplayStop: function () {},
      commercialBreak: function () { return Promise.resolve(); },
      rewardedBreak: function () { return Promise.resolve(false); }
    };
  </script>
  <script src="soccerskills.js"></script>
</head>
<body onload="init()" bgcolor="#000000">
  <canvas id="gamecanvas" width="1280" height="720"
    style="padding-left:0;padding-right:0;margin-right:auto;margin-left:auto;display:block;"
    onclick="canvasclick()"></canvas>

  <div id="credits">
    <a href="https://github.com/ItzJeans" target="_blank" rel="noopener noreferrer"
       class="img-button" aria-label="Open ItzJeans on GitHub">
      <img src="launcher-ui/btn_github.png" alt="GitHub">
    </a>
  </div>
  <div id="fullscreen-btn">
    <button type="button" onclick="toggleFullScreen()" class="img-button" aria-label="Toggle fullscreen">
      <img src="launcher-ui/btn_fullscreen.png" alt="Fullscreen">
    </button>
  </div>

  <script>
    var canvasElement = document.getElementById('gamecanvas');
    canvasElement.addEventListener('mousedown', msdown, false);
    canvasElement.addEventListener('mousemove', msmove, false);
    canvasElement.addEventListener('mouseup', msup, false);
    canvasElement.addEventListener('mouseout', msup, false);
    canvasElement.addEventListener('touchmove', frmove, false);
    canvasElement.addEventListener('touchstart', frdown, false);
    canvasElement.addEventListener('touchend', frup, false);

    var rd = canvasElement.getContext('2d');
    var xm = 0, ym = 0, mdown = false;
    function msmove(evt) {
      var rect = canvasElement.getBoundingClientRect();
      xm = (evt.clientX - rect.left) * (canvasElement.width / rect.width);
      ym = (evt.clientY - rect.top) * (canvasElement.height / rect.height);
    }
    function msdown(evt) { msmove(evt); mdown = true; }
    function msup() { mdown = false; }
    function frmove(evt) {
      if (!evt.touches.length) return;
      var touch = evt.touches[0];
      var rect = canvasElement.getBoundingClientRect();
      xm = (touch.clientX - rect.left) * (canvasElement.width / rect.width);
      ym = (touch.clientY - rect.top) * (canvasElement.height / rect.height);
      evt.preventDefault();
    }
    function frdown(evt) { frmove(evt); mdown = true; }
    function frup() { mdown = false; }

    function init() {
      PokiSDK.init().then(startLoading).catch(function () { startLoading(); });
    }
    function startLoading() { gamerun(); PokiSDK.gameLoadingStart(); }
    function loadingComplete() { PokiSDK.gameLoadingFinished(); }
    function gameplayStart() { PokiSDK.commercialBreak().then(function () { PokiSDK.gameplayStart(); }); }
    function gameplayStop() { PokiSDK.gameplayStop(); }
    function showAdvert() { PokiSDK.gameplayStop(); adpause = true; PokiSDK.commercialBreak().then(function () { PokiSDK.gameplayStart(); adpause = false; }); }
    function showRewardAd() { PokiSDK.gameplayStop(); adpause = true; PokiSDK.rewardedBreak().then(function (success) { if (success) cntimeout = 3; else cntimeout = 2; PokiSDK.gameplayStart(); pointcnt = 0; adpause = false; }); }

    var omutemusic = false, omutegame = false;
    try {
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') {
          mutemusic = omutemusic; mutegame = omutegame;
        } else {
          omutemusic = mutemusic; omutegame = mutegame;
          mutemusic = true; mutegame = true;
        }
      });
    } catch (e) { /* Browser may not support visibilitychange. */ }
  </script>
  <script src="launcher-ui/snippets/fullscreen.js"></script>
</body>
</html>
