<!-- Exact GitHub and fullscreen controls based on the supplied Heaven For Death launcher. -->
<div id="credits">
  <a href="https://github.com/ItzJeans"
     target="_blank"
     rel="noopener noreferrer"
     class="img-button"
     aria-label="Open ItzJeans on GitHub">
    <img src="launcher-ui/btn_github.png" alt="GitHub">
  </a>
</div>

<div id="fullscreen-btn">
  <button type="button" onclick="toggleFullScreen()" class="img-button" aria-label="Toggle fullscreen">
    <img src="launcher-ui/btn_fullscreen.png" alt="Fullscreen">
  </button>
</div>
